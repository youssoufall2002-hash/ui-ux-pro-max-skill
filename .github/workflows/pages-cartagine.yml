name: Anteprima sito Cartagine

on:
  push:
    branches: [claude/ciao-0ndiy1]
    paths: ['cartagine-sito/**', '.github/workflows/pages-cartagine.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepara i file da pubblicare
        run: |
          cp -r cartagine-sito _site
          rm -f _site/README.md _site/COME-CARICARE.txt
          # anteprima: non deve comparire nei motori di ricerca
          # al posto del sito vero www.cartaginepizza.it
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - name: Carica l'artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
